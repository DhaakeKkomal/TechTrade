apiVersion: apps/v1
kind: Deployment
metadata:
  name: techtrade-backend
  labels:
    app: techtrade-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: techtrade-backend
  template:
    metadata:
      labels:
        app: techtrade-backend
    spec:
      containers:
      - name: backend
        image: techtrade-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "postgresql://postgres:postgres@postgres-service:5432/techtrade"
---
apiVersion: v1
kind: Service
metadata:
  name: techtrade-backend-service
spec:
  selector:
    app: techtrade-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: techtrade-frontend
  labels:
    app: techtrade-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: techtrade-frontend
  template:
    metadata:
      labels:
        app: techtrade-frontend
    spec:
      containers:
      - name: frontend
        image: techtrade-frontend:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: techtrade-frontend-service
spec:
  selector:
    app: techtrade-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: techtrade-ingress
spec:
  rules:
  - host: techtrade.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: techtrade-frontend-service
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: techtrade-backend-service
            port:
              number: 8000
